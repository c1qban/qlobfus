{
  "job_name": "project_codenet_c_full_local",
  "dataset": {
    "name": "project-codenet-c-full-local",
    "language": "c",
    "layout": "project_codenet",
    "source_root": "data/Project_CodeNet/data",
    "metadata_csv": "data/Project_CodeNet/metadata",
    "metadata_key_field": "submission_id",
    "metadata_lookup": "submission_id",
    "metadata_glob": "p*.csv",
    "language_dirs": ["C"],
    "sample_id_template": "{problem_id}/{submission_id}",
    "processed_root": "data/processed/project_codenet_c_full_local",
    "manifest_path": "data/manifests/project_codenet_c_full_local.manifest.json",
    "file_patterns": ["*.c"]
  },
  "split": {
    "strategy": "project_holdout",
    "seed": "project_codenet_full_local_v1",
    "train_ratio": 0.8,
    "validation_ratio": 0.1,
    "test_ratio": 0.1
  },
  "filters": {
    "min_lines": 5,
    "max_lines": 400,
    "accepted_only": true,
    "metadata_status_field": "status",
    "accepted_values": ["Accepted", "AC"],
    "require_compilable": false
  },
  "verification": {
    "compile": {
      "compiler": "C:\\Program Files\\LLVM\\bin\\clang.exe",
      "compiler_flags": ["-O0"],
      "timeout_sec": 15.0
    },
    "harness": {
      "format": "executable_stdio_v1"
    }
  },
  "preview_limit": 20
}
