    "seed": "project_codenet_partial_local_v1",
    "train_ratio": 0.8,
    "validation_ratio": 0.1,
    "test_ratio": 0.1
  },
  "filters": {
    "min_lines": 5,
    "max_lines": 400,
    "accepted_only": false,
    "require_compilable": true
  },
  "verification": {
    "compile": {
      "compiler": "C:\\Program Files\\LLVM\\bin\\clang.exe",
      "compiler_flags": ["-O0"],
      "timeout_sec": 15.0
    },
    "harness": {
      "format": "executable_stdio_v1"
    }
  },
  "preview_limit": 20
}
