{
  "job_name": "mppo_codenet_subset_10x5_ablation_no_llvm_reward_long",
  "environment": {
    "id": "obfuscation-env-v0",
    "max_steps": 8,
    "parallel_envs": 1,
    "semantic_threshold": 0.97,
    "action_safety": {
      "enabled": true,
      "filter_risky_actions": true,
      "max_allowed_risk": 0.7,
      "penalize_bulk_without_harness": true,
      "penalize_unmapped_llvm": false
    },
    "verification": {
      "fuzz_enabled": true,
      "fuzz_max_cases": 16
    }
  },
  "policy": {
    "algorithm": "maskable_ppo",
    "hierarchical": true,
    "state_encoder": "ast_cfg_ir_mlp",
    "action_masking": true
  },
  "reward": {
    "semantic_gate": 0.97,
    "security_weight": 1.0,
    "potency_weight": 0.4,
    "cost_weight": 0.3,
    "diversity_weight": 0.1,
    "llvm_block_weight": 0.0,
    "branch_rewrite_weight": 0.0,
    "ir_delta_weight": 0.0
  },
  "training": {
    "execution_mode": "auto",
    "total_timesteps": 1536,
    "n_steps": 32,
    "batch_size": 32,
    "learning_rate": 0.0003,
    "gamma": 0.99,
    "device": "auto",
    "seed": 7,
    "verbose": 0,
    "checkpoint_selection": {
      "metric_name": "semantic+potency+verifier-cost",
      "semantic_weight": 0.45,
      "potency_weight": 0.25,
      "llvm_block_weight": 0.0,
      "branch_rewrite_weight": 0.0,
      "ir_delta_weight": 0.0,
      "verifier_weight": 0.25,
      "cost_weight": 0.05
    },
    "periodic_evaluation": {
      "enabled": true,
      "every_n_episodes": 20,
      "benchmark": {
        "name": "project_codenet_subset_10x5_all_periodic_eval",
        "datasets": ["all"]
      },
      "metrics": ["semantic", "potency", "cost", "resilience", "llvm_ir"]
    },
    "run_root": "artifacts"
  }
}
