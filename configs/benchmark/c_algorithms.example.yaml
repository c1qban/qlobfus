{
  "job_name": "c_algorithms",
  "dataset": {
    "name": "c-algorithms",
    "language": "c",
    "layout": "generic_recursive",
    "source_root": "data/raw/c-algorithms",
    "processed_root": "data/processed/c_algorithms",
    "manifest_path": "data/manifests/c_algorithms.manifest.json",
    "file_patterns": ["*.c"]
  },
  "split": {
    "strategy": "hash_random",
    "seed": "c_algorithms_v1",
