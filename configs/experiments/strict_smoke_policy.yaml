{
  "job_name": "mppo_project_codenet_c_100x4_strict_smoke",
  "environment": {
    "id": "obfuscation-env-v0",
    "max_steps": 8,
    "parallel_envs": 1,
    "semantic_threshold": 0.97,
    "action_safety": {
      "enabled": true,
      "filter_risky_actions": true,
      "max_allowed_risk": 0.7,
      "penalize_bulk_without_harness": true,
      "penalize_unmapped_llvm": false,
      "blocked_risk_levels": ["high"],
      "blocked_parameter_tags": ["neg_add"]
    },
    "verification": {
      "fuzz_enabled": true,
      "fuzz_max_cases": 16
    }
  },
  "policy": {
    "algorithm": "maskable_ppo",
    "hierarchical": true,
    "state_encoder": "ast_cfg_ir_mlp",
    "action_masking": true
  },
  "reward": {
    "semantic_gate": 0.97,
    "security_weight": 1.0,
    "potency_weight": 0.4,
    "cost_weight": 0.3,
    "diversity_weight": 0.1,
    "llvm_block_weight": 0.15,
    "branch_rewrite_weight": 0.1,
    "ir_delta_weight": 0.15
  },
  "training": {
    "execution_mode": "auto",
    "total_timesteps": 96,
    "n_steps": 16,
    "batch_size": 16,
    "learning_rate": 0.0003,
    "gamma": 0.99,
    "device": "auto",
    "seed": 7,
    "verbose": 0,
    "checkpoint_selection": {
      "metric_name": "semantic+potency+llvm_coverage+branch_rewrite+ir_delta+verifier-cost",
      "semantic_weight": 0.35,
      "potency_weight": 0.20,
      "llvm_block_weight": 0.15,
      "branch_rewrite_weight": 0.10,
      "ir_delta_weight": 0.10,
      "verifier_weight": 0.15,
      "cost_weight": 0.05
    },
    "periodic_evaluation": {
      "enabled": false,
      "every_n_episodes": 10,
      "benchmark": {
        "name": "project_codenet_c_100x4_strict_smoke_periodic_eval",
        "datasets": ["smoke_harnessed_10"]
      },
      "metrics": ["semantic", "potency", "cost", "resilience", "llvm_ir"]
    },
    "run_root": "artifacts/strict_smoke_unified"
  }
}
