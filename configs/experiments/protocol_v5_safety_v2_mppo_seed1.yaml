{
  "job_name": "protocol_v5_safety_v2_mppo_seed1",
  "environment": {
    "id": "obfuscation-env-v0",
    "max_steps": 8,
    "parallel_envs": 1,
    "semantic_threshold": 0.97,
    "action_safety": {
      "enabled": true,
      "filter_risky_actions": true,
      "max_allowed_risk": 0.7,
      "penalize_bulk_without_harness": true,
      "penalize_unmapped_llvm": false,
      "blocked_risk_levels": ["high"],
      "blocked_parameter_tags": ["neg_add"],
      "blocked_action_patterns": [
        "encode_literals:ast_literal_bulk:*",
