        "split_blocks:ast_decl_bulk:*",
        "flatten_cfg:*"
      ]
    },
    "verification": {"fuzz_enabled": true, "fuzz_max_cases": 16},
    "early_stop": {"enabled": true, "min_successful_actions": 1, "allow_if_no_transform_actions": true}
