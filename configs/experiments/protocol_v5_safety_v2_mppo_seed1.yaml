  "policy": {
    "algorithm": "maskable_ppo",
    "hierarchical": true,
    "state_encoder": "ast_cfg_ir_mlp",
    "action_masking": true
  },
  "reward": {
    "semantic_gate": 0.97,
    "security_weight": 1.0,
    "potency_weight": 0.4,
    "cost_weight": 0.3,
    "diversity_weight": 0.1,
    "llvm_block_weight": 0.15,
    "branch_rewrite_weight": 0.1,
    "ir_delta_weight": 0.15
  },
  "training": {
    "execution_mode": "train",
    "split_index_path": "data/processed/project_codenet_c_500x4_strict/protocol_v5/train_harness_clean.index.json",
    "total_timesteps": 4096,
    "n_steps": 64,
    "batch_size": 64,
    "learning_rate": 0.0003,
    "gamma": 0.99,
    "device": "cpu",
    "seed": 1,
    "verbose": 0,
    "checkpoint_selection": {
      "metric_name": "semantic_constrained_validation_utility",
      "validation_split_index_path": "data/processed/project_codenet_c_500x4_strict/protocol_v5/validation_harness_clean.index.json",
      "validation_every_n_episodes": 100,
      "min_semantic_score": 0.97,
      "min_semantic_pass_rate": 0.97,
      "min_transformation_rate": 0.50,
      "semantic_weight": 0.0,
      "potency_weight": 0.35,
      "llvm_block_weight": 0.20,
      "branch_rewrite_weight": 0.15,
      "ir_delta_weight": 0.15,
      "verifier_weight": 0.10,
      "cost_weight": 0.05
    },
    "periodic_evaluation": {"enabled": false},
    "run_root": "artifacts/protocol_v5/safety_v2_training"
  }
