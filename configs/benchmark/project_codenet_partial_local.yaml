{
  "job_name": "project_codenet_c_partial_local",
  "dataset": {
    "name": "project-codenet-c-partial-local",
    "language": "c",
    "layout": "project_codenet",
    "source_root": "data/raw/Project_CodeNet/data",
    "metadata_csv": "",
    "metadata_key_field": "submission_id",
    "metadata_lookup": "submission_id",
    "language_dirs": ["C"],
    "sample_id_template": "{problem_id}/{submission_id}",
    "processed_root": "data/processed/project_codenet_c_partial_local",
