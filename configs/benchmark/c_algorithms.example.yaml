    "validation_ratio": 0.1,
    "test_ratio": 0.1
  },
  "filters": {
    "min_lines": 20,
    "max_lines": 2000,
    "require_compilable": true
  },
  "verification": {
    "compile": {
      "compiler": "C:\\Program Files\\LLVM\\bin\\clang.exe",
      "compiler_flags": ["-O0", "-c"],
      "timeout_sec": 15.0
    },
    "harness": {
      "format": "executable_stdio_v1"
    }
  },
  "preview_limit": 20
}
